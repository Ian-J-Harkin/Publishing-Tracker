services:
  api:
    secrets:
      - jwt_key

  agent:
    environment:
      AIProvider__Type: "${AI_PROVIDER_TYPE:-gemini}"
    secrets:
      - ai_provider_api_key
      - jwt_key

secrets:
  ai_provider_api_key:
    file: ${AI_PROVIDER_API_KEY_SECRET_FILE:-./.secrets/ai_provider_api_key.secret}
  jwt_key:
    file: ${JWT_KEY_SECRET_FILE:-./.secrets/jwt_key.secret}
