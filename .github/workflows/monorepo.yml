name: Monorepo Full CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - "Publishing-Tracker/apps/api/**"
      - "Publishing-Tracker/apps/ui-react/**"
      - "Publishing-Tracker/apps/ui-angular/**"
      - "Publishing-Tracker/package.json"
      - "Publishing-Tracker/package-lock.json"
      - ".github/workflows/monorepo.yml"
  workflow_dispatch:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: publishingtracker_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d publishingtracker_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Publishing-Tracker/apps/api/PublishingTracker.Api.sln
      - run: dotnet build Publishing-Tracker/apps/api/PublishingTracker.Api.sln --configuration Release --no-restore
      - name: Test
        env:
          TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=publishingtracker_tests;Username=postgres;Password=postgres
        run: dotnet test Publishing-Tracker/apps/api/PublishingTracker.Api.sln --no-build --configuration Release --filter "Category!=LiveEval" --verbosity normal

  react:
    name: React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Publishing-Tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Publishing-Tracker/package-lock.json
      - run: npm ci
      - run: npm run lint --workspace=@publishing-tracker/ui-react
      - run: npm run build --workspace=@publishing-tracker/ui-react
      - run: npm test --workspace=@publishing-tracker/ui-react

  angular:
    name: Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Publishing-Tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Publishing-Tracker/package-lock.json
      - run: npm ci
      - run: npm run build --workspace=@publishing-tracker/ui-angular
      - run: npm run test --workspace=@publishing-tracker/ui-angular -- --watch=false --browsers=ChromeHeadless
