name: API CI

on:
  push:
    branches: [ main ]
    paths:
      - "Publishing-Tracker/apps/api/**"
      - ".github/workflows/api.yml"
      - ".github/workflows/monorepo.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Publishing-Tracker/apps/api/**"
      - ".github/workflows/api.yml"
      - ".github/workflows/monorepo.yml"
  workflow_dispatch:

jobs:
  build-test-api:
    name: Build and test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: publishingtracker_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d publishingtracker_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Publishing-Tracker/apps/api/PublishingTracker.Api.sln

      - name: Build
        run: dotnet build Publishing-Tracker/apps/api/PublishingTracker.Api.sln --configuration Release --no-restore

      - name: Test
        env:
          TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=publishingtracker_tests;Username=postgres;Password=postgres
        run: dotnet test Publishing-Tracker/apps/api/PublishingTracker.Api.sln --no-build --configuration Release --filter "Category!=LiveEval" --verbosity normal

  live-eval:
    name: Live Smoke Evals (Opt-In)
    runs-on: ubuntu-latest
    needs: build-test-api
    if: github.event_name == 'workflow_dispatch' && vars.RUN_LIVE_EVALS == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run Layer 3 Live Smoke Evals
        env:
          RUN_LIVE_EVALS: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: dotnet test Publishing-Tracker/apps/api/tests/PublishingTracker.Evals/PublishingTracker.Evals.csproj --configuration Release --filter "Category=LiveEval" --verbosity normal
