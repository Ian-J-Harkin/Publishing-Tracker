name: API CI

on:
  push:
    branches: [ main ]
    paths:
      - "Publishing-Tracker/apps/api/**"
      - ".github/workflows/api.yml"
      - ".github/workflows/monorepo.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Publishing-Tracker/apps/api/**"
      - ".github/workflows/api.yml"
      - ".github/workflows/monorepo.yml"
  workflow_dispatch:

jobs:
  build-test-api:
    name: Build and test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Publishing-Tracker/apps/api/PublishingTracker.Api.sln

      - name: Build
        run: dotnet build Publishing-Tracker/apps/api/PublishingTracker.Api.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Publishing-Tracker/apps/api/PublishingTracker.Api.sln --no-build --verbosity normal
