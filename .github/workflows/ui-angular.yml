name: UI Angular CI

on:
  push:
    branches: [ main ]
    paths:
      - "Publishing-Tracker/apps/ui-angular/**"
      - "Publishing-Tracker/package.json"
      - "Publishing-Tracker/package-lock.json"
      - ".github/workflows/ui-angular.yml"
      - ".github/workflows/monorepo.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Publishing-Tracker/apps/ui-angular/**"
      - "Publishing-Tracker/package.json"
      - "Publishing-Tracker/package-lock.json"
      - ".github/workflows/ui-angular.yml"
      - ".github/workflows/monorepo.yml"
  workflow_dispatch:

jobs:
  build-test-angular:
    name: Build and test Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Publishing-Tracker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Publishing-Tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=@publishing-tracker/ui-angular

      - name: Test
        run: npm run test --workspace=@publishing-tracker/ui-angular -- --watch=false --browsers=ChromeHeadless
