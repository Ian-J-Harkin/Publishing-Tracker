name: UI React CI

on:
  push:
    branches: [ main ]
    paths:
      - "Publishing-Tracker/apps/ui-react/**"
      - "Publishing-Tracker/package.json"
      - "Publishing-Tracker/package-lock.json"
      - ".github/workflows/ui-react.yml"
      - ".github/workflows/monorepo.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Publishing-Tracker/apps/ui-react/**"
      - "Publishing-Tracker/package.json"
      - "Publishing-Tracker/package-lock.json"
      - ".github/workflows/ui-react.yml"
      - ".github/workflows/monorepo.yml"
  workflow_dispatch:

jobs:
  lint-build-test-react:
    name: Lint, build and test React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Publishing-Tracker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Publishing-Tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=@publishing-tracker/ui-react

      - name: Build
        run: npm run build --workspace=@publishing-tracker/ui-react

      - name: Test
        run: npm test --workspace=@publishing-tracker/ui-react
